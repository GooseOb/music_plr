[package]
name = "music_plr"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = { version = "0.20", features = ["symphonia-all"] }
confy = "0.6"
directories = "6"
anyhow = "1"
rfd = "0.15"
zbus = { version = "4", default-features = false, features = ["tokio"] }

[build-dependencies]
slint-build = "1"
