[package]
name = "goosemusic"
version = "1.1.4"
edition = "2021"
description = "A music player with YouTube search, local playback, and OS media controls"
license = "MIT"
repository = "https://github.com/GooseOb/music_plr"
readme = "README.md"

[dependencies]
iced = { version = "0.14", features = ["image", "svg", "tokio", "debug", "canvas", "advanced"] }
# Pinned to the same version iced resolves to, so we can implement the
# `widget::operation::Operation` trait (not publicly re-exported by `iced`).
# Keep this in lockstep with `iced`'s `iced_core` when upgrading.
iced_core = { package = "iced_core", version = "0.14" }
# Same reasoning as `iced_core`: `iced` doesn't publicly re-export the
# `task::widget(operation)` constructor we need to run a custom `Operation`.
# Keep in lockstep with `iced`'s `iced_runtime` when upgrading.
iced_runtime = { package = "iced_runtime", version = "0.14" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = { version = "0.20", features = ["symphonia-all"] }
symphonia = { version = "0.5", features = ["all"] }
directories = "6"
anyhow = "1"
ureq = { version = "3", features = ["json"] }
rfd = "0.15"
# Cross-platform OS media controls: MPRIS (Linux), SMTC (Windows), Now Playing
# (macOS). `use_zbus` selects the pure-Rust zbus backend on Linux; on the other
# platforms that feature is inert and the native backend is always compiled.
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
musicbrainz_rs = { version = "0.13", features = ["sync"] }
rsoundcloud = "0.2"
csv = "1"
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
winres = "0.1"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
