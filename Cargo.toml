[package]
name = "music_plr"
version = "0.1.0"
edition = "2021"
description = "A music player with YouTube search, local playback, and MPRIS integration"
license = "MIT"

[dependencies]
iced = { version = "0.14", features = ["image", "svg", "tokio", "debug"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = { version = "0.20", features = ["symphonia-all"] }
symphonia = "0.5"
confy = "0.6"
directories = "6"
anyhow = "1"
ureq = "3"
rfd = "0.15"
zbus = { version = "4", default-features = false, features = ["tokio"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
