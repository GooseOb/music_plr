# Build release binaries for every desktop target and publish them as a
# GitHub release whenever a tag matching `v*` is pushed (e.g. `v1.2.3`).
#
# Targets built on native runners:
#   - Linux   x86_64   (ubuntu-latest)
#   - Windows x86_64   (windows-latest, MSVC)
#   - macOS   aarch64  (macos-latest, Apple Silicon — native)
#   - macOS   x86_64   (macos-latest, cross-compiled on Apple Silicon)
#
# To also ship Linux ARM (e.g. aarch64/armv7) add a matrix entry that runs on
# ubuntu-latest and builds with `cross` (https://github.com/cross-rs/cross),
# which supplies a Docker image carrying the cross toolchain + system libs:
#   - os: ubuntu-latest
#     target: aarch64-unknown-linux-gnu
#     use-cross: true
# then `cargo install cross` and replace `cargo build` with `cross build`
# when `matrix.use-cross` is set.
name: Release

on:
  push:
    tags:
      - "v*"

# Default read-only; the GitHub-release job widens this to `write`.
permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      # iced (winit) + rfd (GTK file dialogs) + rodio/cpal (ALSA) need these
      # dev libraries to link on Linux.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libasound2-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxrandr-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Generate icons
        run: bash scripts/generate-icons.sh

      - name: Compile Windows resources
        if: runner.os == 'Windows'
        shell: bash
        run: |
          OBJ_PATH="$(bash windows/build-resources.sh)"
          echo "RUSTFLAGS=-C link-arg=$OBJ_PATH" >> "$GITHUB_ENV"

      - name: Build
        # Strip on Unix (binutils/Apple `strip` is available). On Windows/MSVC
        # leave it unstripped — there is no `strip.exe` on the PATH by default.
        env:
          CARGO_PROFILE_RELEASE_STRIP: ${{ runner.os == 'Windows' && 'false' || 'true' }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      # ── Linux: tar binary + .desktop file + icon ──────────────────────
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -czf goosemusic-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release goosemusic \
            -C "$GITHUB_WORKSPACE" goosemusic.desktop icons/logo.svg
          echo "ARCHIVE=goosemusic-${{ matrix.target }}.tar.gz" >> "$GITHUB_ENV"

      # ── macOS: wrap in .app bundle ────────────────────────────────────
      - name: Install icnsutils
        if: runner.os == 'macOS'
        run: brew install icnsutils

      - name: Build .app bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x macos/build-app.sh
          macos/build-app.sh \
            target/${{ matrix.target }}/release/goosemusic \
            macos/goosemusic.icns \
            dist

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          tar -czf Goosemusic-${{ matrix.target }}.tar.gz \
            -C dist Goosemusic.app
          echo "ARCHIVE=Goosemusic-${{ matrix.target }}.tar.gz" >> "$GITHUB_ENV"

      # ── Windows: bare .exe (icon embedded via RUSTFLAGS) ──────────────
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/goosemusic.exe `
            -DestinationPath goosemusic-${{ matrix.target }}.zip
          echo "ARCHIVE=goosemusic-${{ matrix.target }}.zip" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: goosemusic-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: goosemusic-*
          merge-multiple: true
          path: dist

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Quick install

            ```sh
            curl -fsSL https://raw.githubusercontent.com/GooseOb/music_plr/main/scripts/install.sh | bash
            ```

            Detects your platform and installs everything. See the [README](https://github.com/GooseOb/music_plr#installation) for manual install options.

            ## Runtime prerequisites

            `goosemusic` is a self-contained binary. On first launch it checks
            for its external tools and can **download `yt-dlp` for you** — a
            standalone binary needing no Python — just accept the prompt. Only
            optional extras remain:

            - **`yt-dlp`** — YouTube audio streaming & downloads (auto-downloaded if missing)
            - **Python 3** + `ytmusicapi` — nicer YouTube Music search; without it the app
              falls back to `yt-dlp` (these are *not* auto-installed)
            - **D-Bus** session bus (Linux) — MPRIS media-key integration (OS-provided)

            Nothing needs installing manually to play, stream, or download.

  # Publishes the crate to crates.io. Requires a repo secret CARGO_REGISTRY_TOKEN
  # (an API token from https://crates.io/settings/tokens). The tag must match the
  # version in Cargo.toml (minus the leading `v`), e.g. tag `v0.1.0` + version 0.1.0.
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # Same link-time system libs as the Linux build: rfd (GTK file dialogs),
      # rodio/cpal (ALSA audio), and iced/winit (wayland/x11).
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libasound2-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxrandr-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(cargo pkgid | sed 's/.*#.*@//')"
          if [ "$tag" != "$ver" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match crate version '$ver'. Bump version in Cargo.toml before tagging."
            exit 1
          fi

      - name: Publish
        run: cargo publish
