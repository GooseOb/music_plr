# Build release binaries for every desktop target and publish them as a
# GitHub release whenever a tag matching `v*` is pushed (e.g. `v1.2.3`).
#
# Platforms (one job each):
#   - icons         – generates .ico + .icns once, uploads as artifact
#   - build-linux   – Ubuntu, x86_64
#   - build-macos   – macOS, aarch64 + x86_64 (matrix, same runner type)
#   - build-windows – Windows, x86_64 MSVC
#   - release       – collects artifacts, publishes GitHub release
#
# To add Linux ARM, create a new `build-linux-arm` job using `cross`
# (https://github.com/cross-rs/cross) on ubuntu-latest.
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Default read-only; the GitHub-release job widens this to `write`.
permissions:
  contents: read

jobs:
  icons:
    name: Generate icons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install icon generation dependencies
        run: sudo apt-get update && sudo apt-get install -y imagemagick icnsutils

      - name: Generate icons
        run: bash scripts/generate-icons.sh

      - name: Upload icons
        uses: actions/upload-artifact@v7
        with:
          name: icons
          path: |
            windows/app.ico
            macos/goosemusic.icns
          if-no-files-found: error

  build-linux:
    name: Build (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libasound2-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxrandr-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: false
          shared-key: "shared"
          key: x86_64-unknown-linux-gnu

      - name: Build
        env:
          CARGO_PROFILE_RELEASE_STRIP: "true"
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Package
        run: |
          tar -czf goosemusic-x86_64-unknown-linux-gnu.tar.gz \
            -C target/x86_64-unknown-linux-gnu/release goosemusic \
            -C "$GITHUB_WORKSPACE" goosemusic.desktop icons/app-icon.svg

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: goosemusic-x86_64-unknown-linux-gnu
          path: goosemusic-x86_64-unknown-linux-gnu.tar.gz
          if-no-files-found: error

      - name: Publish to crates.io
        continue-on-error: true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

  build-macos:
    name: Build (${{ matrix.target }})
    needs: icons
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: false
          shared-key: "shared"
          key: ${{ matrix.target }}

      - name: Download icons
        uses: actions/download-artifact@v8
        with:
          name: icons
          path: macos

      - name: Build
        env:
          CARGO_PROFILE_RELEASE_STRIP: "true"
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build .app bundle
        run: |
          chmod +x macos/build-app.sh
          macos/build-app.sh \
            target/${{ matrix.target }}/release/goosemusic \
            macos/goosemusic.icns \
            dist

      - name: Package
        run: |
          tar -czf goosemusic-${{ matrix.target }}.tar.gz \
            -C dist Goosemusic.app
          echo "ARCHIVE=goosemusic-${{ matrix.target }}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: goosemusic-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  build-windows:
    name: Build (x86_64-pc-windows-msvc)
    needs: icons
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: false
          shared-key: "shared"
          key: x86_64-pc-windows-msvc

      - name: Download icons
        uses: actions/download-artifact@v8
        with:
          name: icons
          path: windows

      - name: Build
        env:
          CARGO_PROFILE_RELEASE_STRIP: "false"
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path target/x86_64-pc-windows-msvc/release/goosemusic.exe `
            -DestinationPath goosemusic-x86_64-pc-windows-msvc.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: goosemusic-x86_64-pc-windows-msvc
          path: goosemusic-x86_64-pc-windows-msvc.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: goosemusic-*
          merge-multiple: true
          path: dist

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Quick install

            ```sh
            curl -fsSL https://raw.githubusercontent.com/GooseOb/music_plr/master/scripts/install.sh | bash
            ```

            Detects your platform and installs everything. See the [README](https://github.com/GooseOb/music_plr#installation) for manual install options.

            ## Runtime prerequisites

            `goosemusic` is a self-contained binary. On first launch it checks
            for its external tools and can **download `yt-dlp` for you** — a
            standalone binary needing no Python — just accept the prompt. Only
            optional extras remain:

            - **`yt-dlp`** — YouTube audio streaming & downloads (auto-downloaded if missing)
            - **Python 3** + `ytmusicapi` — nicer YouTube Music search; without it the app
              falls back to `yt-dlp` (these are *not* auto-installed)
            - **D-Bus** session bus (Linux) — MPRIS media-key integration (OS-provided)

            Nothing needs installing manually to play, stream, or download.
